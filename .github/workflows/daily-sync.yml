# Daily: scrape website -> match against CRM -> report the proposal queue.
# This job NEVER writes to the CRM and never commits. Writes only happen from the
# review app on approval.
#
# State: decisions (approved/rejected/applied) live in state/decisions.jsonl,
# committed by reviewers. It is append-only text with `merge=union`, so it never
# conflicts. This job only READS it, so a re-run never re-proposes a decided item.
# The SQLite queue (state/sync.db) is a disposable local cache, rebuilt each run.
name: daily-sync
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: daily-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run pipeline (read-only)
        run: python -m bellhaven.run | tee run.json
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
      - name: Summarise queue
        run: |
          {
            echo "## Bellhaven sync";
            echo '```json'; cat run.json; echo '```';
            echo "### Pending proposals";
            sqlite3 -separator ' | ' state/sync.db "SELECT kind, title FROM proposals WHERE status='pending' ORDER BY kind, title" | sed 's/^/- /';
          } >> "$GITHUB_STEP_SUMMARY"
